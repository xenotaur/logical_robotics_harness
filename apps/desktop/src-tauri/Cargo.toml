[package]
name = "lrh-console"
version = "0.1.0"
description = "LRH Console desktop shell (L0)"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false

[lib]
name = "lrh_console_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tauri = { version = "=2.12.0", features = ["test"] }
serde_json = "1"
