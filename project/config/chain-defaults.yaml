# Chain-defaults profile for LRH's chain-running skills (/lrh-land,
# /lrh-execute). See src/lrh/skills/_shared/chain-defaults.md for the
# propose-and-confirm flow this file drives, and PROP-LRH-CHAIN-DEFAULTS's
# "Steelmanned Defaults" section for where these three values came from.
#
# confirmed_commit/confirmed_at are null until a human live-confirms these
# values at a chain-authorization gate for the first time in this repo.
completion_condition: "PR merged, its execution records landed, and any linked work item resolved."
stop_work_condition: "Any failing CI check, a reviewer finding that isn't Clear-satisfied on re-verification, or an ambiguous/refused merge-authorization reply."
self_review_preference: substitute_self_review
chain_init_confirmation: always_confirm
confirmed_commit: null
confirmed_at: null
