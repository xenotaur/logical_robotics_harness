<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- LRH Console frame mock (Revision 2 of PROP-LRH-CONSOLE-VISUAL-LANGUAGE). Illustrative sample data; not live project state. -->
<title>LRH Console Frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap">
<style>
/* Layout: app frame = top bar over (sidebar | main | drawer); main hosts the statusboard (bands) and the map (lanes x phases). */
/* Draft of the shared LRH Console token file. Okabe-Ito-derived status hues; accent from the LRH v8 icon. */
:root {
  --color-surface-page: #f3f5f9;
  --color-surface-panel: #ffffff;
  --color-surface-sunken: #e9edf4;
  --color-surface-overlay: #ffffff;
  --color-text-primary: #0f1a2b;
  --color-text-muted: #55627a;
  --color-border-subtle: #d8dee8;
  --color-border-strong: #b5bfcf;
  --color-accent: #2f55d4;
  --color-accent-bg: #e6ecfc;
  --color-on-accent: #ffffff;
  --color-focus: #2f55d4;
  --color-edge: #9aa6b8;
  --color-edge-strong: #2f3d55;

  --color-status-done-fg: #00664a;      --color-status-done-bg: #e1f2ec;      --color-status-done-line: #009e73;
  --color-status-progress-fg: #00507e;  --color-status-progress-bg: #e1edf7;  --color-status-progress-line: #0072b2;
  --color-status-unblocked-fg: #165f86; --color-status-unblocked-bg: #e3f3fb; --color-status-unblocked-line: #56b4e9;
  --color-status-waiting-fg: #744900;   --color-status-waiting-bg: #fbefd6;   --color-status-waiting-line: #e69f00;
  --color-status-blocked-fg: #9a3b00;   --color-status-blocked-bg: #fbe6d9;   --color-status-blocked-line: #d55e00;
  --color-status-review-fg: #80356a;    --color-status-review-bg: #f6e5ef;    --color-status-review-line: #cc79a7;
  --color-status-unknown-fg: #4c576a;   --color-status-unknown-bg: #edf0f5;   --color-status-unknown-line: #8a94a6;

  --font-display: "Montserrat", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius-sm: 6px;
  --radius-md: 10px;
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem; --space-6: 1.5rem;
  --motion-fast: 140ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-surface-page: #08111f;
    --color-surface-panel: #0e1a2e;
    --color-surface-sunken: #0a1525;
    --color-surface-overlay: #13223a;
    --color-text-primary: #e8eef8;
    --color-text-muted: #9aa8bf;
    --color-border-subtle: #21314a;
    --color-border-strong: #34496a;
    --color-accent: #7ea0ff;
    --color-accent-bg: #172a4f;
    --color-on-accent: #08111f;
    --color-focus: #7ea0ff;
    --color-edge: #4a5d7d;
    --color-edge-strong: #c9d5ea;
    --color-status-done-fg: #6fd2af;      --color-status-done-bg: #0e3329;      --color-status-done-line: #2bb088;
    --color-status-progress-fg: #7db9ee;  --color-status-progress-bg: #0e2840;  --color-status-progress-line: #3b92d6;
    --color-status-unblocked-fg: #8fd0f5; --color-status-unblocked-bg: #0f2f42; --color-status-unblocked-line: #56b4e9;
    --color-status-waiting-fg: #f5c266;   --color-status-waiting-bg: #3a2a0c;   --color-status-waiting-line: #e69f00;
    --color-status-blocked-fg: #ff9b66;   --color-status-blocked-bg: #40200e;   --color-status-blocked-line: #e36f1e;
    --color-status-review-fg: #e9a4cb;    --color-status-review-bg: #3a1d30;    --color-status-review-line: #cc79a7;
    --color-status-unknown-fg: #a9b3c3;   --color-status-unknown-bg: #1c2636;   --color-status-unknown-line: #6b7688;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --color-surface-page: #08111f;
  --color-surface-panel: #0e1a2e;
  --color-surface-sunken: #0a1525;
  --color-surface-overlay: #13223a;
  --color-text-primary: #e8eef8;
  --color-text-muted: #9aa8bf;
  --color-border-subtle: #21314a;
  --color-border-strong: #34496a;
  --color-accent: #7ea0ff;
  --color-accent-bg: #172a4f;
  --color-on-accent: #08111f;
  --color-focus: #7ea0ff;
  --color-edge: #4a5d7d;
  --color-edge-strong: #c9d5ea;
  --color-status-done-fg: #6fd2af;      --color-status-done-bg: #0e3329;      --color-status-done-line: #2bb088;
  --color-status-progress-fg: #7db9ee;  --color-status-progress-bg: #0e2840;  --color-status-progress-line: #3b92d6;
  --color-status-unblocked-fg: #8fd0f5; --color-status-unblocked-bg: #0f2f42; --color-status-unblocked-line: #56b4e9;
  --color-status-waiting-fg: #f5c266;   --color-status-waiting-bg: #3a2a0c;   --color-status-waiting-line: #e69f00;
  --color-status-blocked-fg: #ff9b66;   --color-status-blocked-bg: #40200e;   --color-status-blocked-line: #e36f1e;
  --color-status-review-fg: #e9a4cb;    --color-status-review-bg: #3a1d30;    --color-status-review-line: #cc79a7;
  --color-status-unknown-fg: #a9b3c3;   --color-status-unknown-bg: #1c2636;   --color-status-unknown-line: #6b7688;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--color-surface-page);
  color: var(--color-text-primary);
  font: 14px/1.45 var(--font-body);
}
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.01em; }
.muted { color: var(--color-text-muted); }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* Top bar */
.topbar {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-2) var(--space-4);
  background: var(--color-surface-panel);
  border-bottom: 1px solid var(--color-border-subtle);
  min-width: 0;
}
.home { display: flex; align-items: center; gap: var(--space-2); border: 0; background: none; padding: 2px; border-radius: var(--radius-sm); cursor: pointer; }
.home img { width: 32px; height: 32px; display: block; }
.page-name { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.page-scope { color: var(--color-text-muted); font-size: 0.85rem; white-space: nowrap; }
.spacer { flex: 1; }
.sample { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: var(--color-status-waiting-bg); color: var(--color-status-waiting-fg); white-space: nowrap; }
.search { display: flex; align-items: center; gap: var(--space-2); border: 1px solid var(--color-border-subtle); background: var(--color-surface-sunken); border-radius: var(--radius-sm); padding: 4px 8px; min-width: 0; }
.search input { border: 0; background: none; outline: none; width: 11rem; min-width: 0; }
.fresh { display: flex; align-items: center; gap: var(--space-2); font-size: 0.8rem; color: var(--color-text-muted); white-space: nowrap; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--color-border-subtle); background: var(--color-surface-panel); border-radius: var(--radius-sm); padding: 5px 7px; cursor: pointer; }
.iconbtn:hover { border-color: var(--color-border-strong); }

/* Body */
.body { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; min-height: 0; position: relative; }

/* Sidebar */
.sidebar { width: 14.5rem; background: var(--color-surface-panel); border-right: 1px solid var(--color-border-subtle); display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3) var(--space-2); overflow-y: auto; transition: width var(--motion-fast) ease; }
.sidebar .sect { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-muted); padding: var(--space-2) var(--space-2) 2px; }
.scope { display: flex; flex-direction: column; gap: 2px; }
.navbtn { display: flex; align-items: center; gap: var(--space-3); width: 100%; border: 0; background: none; padding: 7px var(--space-2); border-radius: var(--radius-sm); cursor: pointer; text-align: left; color: var(--color-text-primary); }
.navbtn:hover { background: var(--color-surface-sunken); }
.navbtn[aria-current="page"], .navbtn[aria-pressed="true"] { background: var(--color-accent-bg); color: var(--color-accent); font-weight: 600; }
.navbtn .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.collapse { margin-top: auto; }
.app.rail .sidebar { width: 3.25rem; }
.app.rail .sidebar .lbl, .app.rail .sidebar .sect { display: none; }
.app.rail .navbtn { justify-content: center; }
.app.rail .collapse svg { transform: rotate(180deg); }

/* Main */
.main { overflow: auto; padding: var(--space-6) clamp(16px, 3vw, 2rem); min-width: 0; }
.hero { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-4); justify-content: space-between; margin-bottom: var(--space-6); }
.hero h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.4rem, 2.6vw, 1.9rem); letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
.hero p { margin: 4px 0 0; color: var(--color-text-muted); max-width: 60ch; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr)); gap: var(--space-3); margin-bottom: var(--space-6); }
.tile { border: 1px solid var(--color-border-subtle); background: var(--color-surface-panel); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); display: flex; gap: var(--space-3); align-items: center; }
.tile .n { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; font-variant-numeric: tabular-nums; line-height: 1; }
.tile .t { font-size: 0.8rem; color: var(--color-text-muted); }
.tile.slot { border-style: dashed; background: none; }
.footer { margin-top: var(--space-6); font-size: 0.8rem; color: var(--color-text-muted); max-width: 75ch; }

/* Status pill */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 0.74rem; font-weight: 600; padding: 2px 8px 2px 6px; border-radius: 999px; background: var(--sbg); color: var(--sfg); border: 1px solid var(--sline); white-space: nowrap; }
.pill svg.i { width: 13px; height: 13px; stroke-width: 2.2; }
.s-done { --sfg: var(--color-status-done-fg); --sbg: var(--color-status-done-bg); --sline: var(--color-status-done-line); }
.s-progress { --sfg: var(--color-status-progress-fg); --sbg: var(--color-status-progress-bg); --sline: var(--color-status-progress-line); }
.s-unblocked { --sfg: var(--color-status-unblocked-fg); --sbg: var(--color-status-unblocked-bg); --sline: var(--color-status-unblocked-line); }
.s-waiting { --sfg: var(--color-status-waiting-fg); --sbg: var(--color-status-waiting-bg); --sline: var(--color-status-waiting-line); }
.s-blocked { --sfg: var(--color-status-blocked-fg); --sbg: var(--color-status-blocked-bg); --sline: var(--color-status-blocked-line); }
.s-review { --sfg: var(--color-status-review-fg); --sbg: var(--color-status-review-bg); --sline: var(--color-status-review-line); }
.s-unknown { --sfg: var(--color-status-unknown-fg); --sbg: var(--color-status-unknown-bg); --sline: var(--color-status-unknown-line); }

/* Statusboard bands */
.bands { display: flex; flex-direction: column; gap: var(--space-3); }
.band { display: grid; grid-template-columns: 13rem minmax(0, 1fr); background: var(--color-surface-panel); border: 1px solid var(--color-border-subtle); border-left: 4px solid var(--sline); border-radius: 0; }
.band-head { padding: var(--space-3) var(--space-4); background: var(--sbg); color: var(--sfg); display: flex; flex-direction: column; gap: 4px; }
.band-head .bt { display: flex; align-items: center; gap: var(--space-2); font-family: var(--font-display); font-weight: 600; font-size: 0.98rem; }
.band-head .bc { font-variant-numeric: tabular-nums; font-weight: 700; margin-left: auto; }
.band-head .bd { font-size: 0.78rem; }
.band-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: var(--space-3); padding: var(--space-3); }
.band-empty { padding: var(--space-3) var(--space-4); color: var(--color-text-muted); font-size: 0.85rem; align-self: center; }
.pcard { border: 1px solid var(--color-border-subtle); border-radius: var(--radius-md); padding: var(--space-3); background: var(--color-surface-panel); display: flex; flex-direction: column; gap: 6px; text-align: left; cursor: pointer; }
.pcard:hover { border-color: var(--color-border-strong); }
.pcard .pt { display: flex; align-items: baseline; gap: var(--space-2); }
.pcard .pn { font-weight: 700; font-size: 0.98rem; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px var(--space-3); font-size: 0.8rem; }
.kv dt { color: var(--color-text-muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.72rem; border: 1px solid var(--color-border-subtle); border-radius: 999px; padding: 1px 8px; color: var(--color-text-muted); background: var(--color-surface-sunken); }

/* Map */
.mapwrap { overflow-x: auto; border: 1px solid var(--color-border-subtle); border-radius: var(--radius-md); background: var(--color-surface-panel); }
.map { position: relative; display: grid; grid-template-columns: 8.5rem repeat(var(--lanes), minmax(12rem, 1fr)); min-width: calc(8.5rem + var(--lanes) * 12rem); }
.map svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 1; }
.lanehead { padding: var(--space-3); border-bottom: 1px solid var(--color-border-subtle); border-left: 1px solid var(--color-border-subtle); position: sticky; top: 0; background: var(--color-surface-panel); z-index: 2; }
.lanehead .ln { font-family: var(--font-display); font-weight: 600; font-size: 0.92rem; }
.lanehead .lk { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-muted); }
.lanehead::before { content: ""; display: block; height: 3px; background: var(--color-accent); opacity: 0.55; margin: calc(-1 * var(--space-3)) calc(-1 * var(--space-3)) var(--space-2); }
.phasehead { padding: var(--space-3); border-bottom: 1px solid var(--color-border-subtle); background: var(--color-surface-sunken); }
.phasehead .pk { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-muted); }
.phasehead .pn { font-weight: 700; font-size: 0.9rem; }
.phasehead .pd { font-size: 0.75rem; color: var(--color-text-muted); }
.corner { border-bottom: 1px solid var(--color-border-subtle); background: var(--color-surface-sunken); padding: var(--space-3); font-size: 0.7rem; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.08em; display: flex; align-items: flex-end; }
.cell { border-bottom: 1px solid var(--color-border-subtle); border-left: 1px solid var(--color-border-subtle); padding: var(--space-4) var(--space-3); display: flex; flex-direction: column; gap: var(--space-4); min-height: 6.5rem; }
.tcard { position: relative; z-index: 3; width: 100%; text-align: left; border: 1px solid var(--color-border-subtle); border-left: 3px solid var(--sline); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; background: var(--color-surface-overlay); padding: var(--space-2) var(--space-3); display: flex; flex-direction: column; gap: 5px; cursor: pointer; transition: opacity var(--motion-fast), border-color var(--motion-fast); }
.tcard:hover { border-color: var(--color-border-strong); border-left-color: var(--sline); }
.tcard .tt { font-weight: 600; font-size: 0.86rem; line-height: 1.3; }
.tcard .tr { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tcard .why { font-size: 0.72rem; color: var(--color-text-muted); }
.tcard.s-blocked { border-left-style: dashed; border-left-width: 3px; }
.tcard.s-done { background: var(--color-surface-panel); }
.tcard.s-done .tt { color: var(--color-text-muted); font-weight: 500; }
.flag { font-size: 0.7rem; color: var(--color-text-muted); border: 1px dashed var(--color-border-strong); border-radius: 999px; padding: 0 7px; }
.tcard.dim { opacity: 0.32; }
.map.focus .tcard.sel { box-shadow: 0 0 0 2px var(--color-accent); }
path.edge { fill: none; stroke: var(--color-edge); stroke-width: 1.4; opacity: 0.55; }
path.edge.block { stroke: var(--color-status-blocked-line); stroke-dasharray: 5 4; opacity: 0.75; }
.map.focus path.edge { opacity: 0.12; }
.map.focus path.edge.hot { opacity: 1; stroke: var(--color-edge-strong); stroke-width: 2; }
.map.focus path.edge.block.hot { stroke: var(--color-status-blocked-line); }
.legend { display: flex; flex-wrap: wrap; gap: var(--space-3) var(--space-4); align-items: center; margin: var(--space-3) 0; font-size: 0.78rem; color: var(--color-text-muted); }
.legend .ln { display: inline-flex; align-items: center; gap: 6px; }
.legend svg.sw { width: 28px; height: 8px; }

/* Table */
.tablewrap { overflow-x: auto; border: 1px solid var(--color-border-subtle); border-radius: var(--radius-md); background: var(--color-surface-panel); }
table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--color-border-subtle); vertical-align: top; }
th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-muted); background: var(--color-surface-sunken); position: sticky; top: 0; }
tr.rowlink { cursor: pointer; }
tr.rowlink:hover td { background: var(--color-surface-sunken); }

/* Blockers */
.blist { display: flex; flex-direction: column; gap: var(--space-3); }
.bitem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-3); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); background: var(--color-surface-panel); cursor: pointer; text-align: left; }
.empty { border: 1px dashed var(--color-border-strong); border-radius: var(--radius-md); padding: var(--space-6); max-width: 46rem; }
.empty h2 { font-family: var(--font-display); font-size: 1.1rem; margin: 0 0 6px; }

/* Drawer */
.drawer { width: 23rem; border-left: 1px solid var(--color-border-subtle); background: var(--color-surface-panel); overflow-y: auto; padding: var(--space-4) var(--space-4) var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); }
.drawer h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; margin: 0; text-wrap: balance; }
.drawer h3 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-muted); margin: 0 0 6px; }
.dhead { display: flex; align-items: flex-start; gap: var(--space-2); }
.layers { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px var(--space-3); font-size: 0.83rem; align-items: center; }
.layers dt { color: var(--color-text-muted); }
.layers dd { margin: 0; }
.plist { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.plist li button { width: 100%; display: flex; justify-content: space-between; gap: var(--space-2); align-items: center; border: 1px solid var(--color-border-subtle); border-radius: var(--radius-sm); background: var(--color-surface-sunken); padding: 6px 8px; cursor: pointer; text-align: left; }
.src { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-sm); padding: 6px 8px; background: var(--color-surface-sunken); overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--color-border-strong); background: var(--color-surface-panel); border-radius: var(--radius-sm); padding: 6px 12px; cursor: pointer; font-weight: 600; }
.btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-on-accent); }

/* Display popover */
.popwrap { position: relative; }
.pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; width: 17rem; background: var(--color-surface-overlay); border: 1px solid var(--color-border-strong); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); box-shadow: 0 10px 30px rgba(8, 17, 31, 0.18); }
.pop h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-muted); margin: 0 0 8px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm); overflow: hidden; }
.seg button { border: 0; background: none; padding: 6px 4px; cursor: pointer; font-size: 0.82rem; }
.seg button + button { border-left: 1px solid var(--color-border-strong); }
.seg button[aria-pressed="true"] { background: var(--color-accent); color: var(--color-on-accent); font-weight: 600; }
.pop p { font-size: 0.78rem; color: var(--color-text-muted); margin: 8px 0 0; }

@media (max-width: 60rem) {
  .drawer { position: absolute; inset: 0 0 0 auto; width: min(100%, 26rem); z-index: 30; box-shadow: -12px 0 30px rgba(8, 17, 31, 0.2); }
}
@media (max-width: 42rem) {
  .sidebar { width: 3.25rem; }
  .sidebar .lbl, .sidebar .sect { display: none; }
  .navbtn { justify-content: center; }
  .search input { width: 6rem; }
  .fresh .ft, .sample, .page-scope { display: none; }
  .band { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>

  var byId = {};
  ITEMS.forEach(function (it) { byId[it.id] = it; });
  function isDone(id) { return byId[id] && byId[id].life === "resolved"; }
  function state(it) {
    if (it.life === "resolved") return "done";
    if (it.life === "active") return "progress";
    if (it.blk.some(function (b) { return !isDone(b); })) return "blocked";
    if (it.deps.some(function (d) { return !isDone(d); })) return "waiting";
    return "unblocked";
  }
  function why(it) {
    var s = state(it);
    if (s === "blocked") return "Blocked by " + it.blk.filter(function (b) { return !isDone(b); }).join(", ");
    if (s === "waiting") return "Waiting on " + it.deps.filter(function (d) { return !isDone(d); }).join(", ");
    return "";
  }
  function dependents(id) { return ITEMS.filter(function (it) { return it.deps.indexOf(id) >= 0 || it.blk.indexOf(id) >= 0; }); }
  function upstream(id, acc) { acc = acc || {}; var it = byId[id]; it.deps.concat(it.blk).forEach(function (p) { if (!acc[p]) { acc[p] = 1; upstream(p, acc); } }); return acc; }
  function downstream(id, acc) { acc = acc || {}; dependents(id).forEach(function (d) { if (!acc[d.id]) { acc[d.id] = 1; downstream(d.id, acc); } }); return acc; }

  function renderStatusboard() {

    var html = '<div class="hero"><div><h1>Which projects need you now?</h1><p>Every registered project, grouped into bands by operational state. Each claim names its evidence, or says it is unknown.</p></div></div>';

      else {
        html += '<div class="band-cards">' + ps.map(function (p) {
          return '<button class="pcard" data-project="' + p.name + '"><span class="pt"><span class="pn">' + esc(p.name) + '</span><span class="muted" style="font-size:0.75rem;margin-left:auto">' + esc(p.fresh) + '</span></span><dl class="kv"><dt>Focus</dt><dd>' + esc(p.focus) + "</dd><dt>Next</dt><dd>" + esc(p.next) + '</dd></dl><span class="chips"><span class="chip">' + esc(p.evidence) + "</span></span></button>";
        }).join("") + "</div>";
      }
      html += "</section>";
    });
    html += "</div>";
    return html + footer();
  }

  function renderOverview() {
    if (route.scope !== "LCATS") return emptyProject();
    var c = counts();
    var html = '<div class="hero"><div><h1>See the work that can move, and what stops it.</h1><p>LCATS project control plane. Structural states are computed from depends_on and blocked_by in the snapshot; lifecycle comes from each work item.</p></div></div>';
    html += '<div class="tiles">' +
      tile("blocked", c.blocked, "Blocked") + tile("waiting", c.waiting, "Waiting") + tile("unblocked", c.unblocked, "Unblocked") + tile("progress", c.progress, "In progress") +
      '<div class="tile slot"><span class="pill s-unknown">' + icon("i-unknown") + 'Later</span><span><span class="t">Effort and critical path</span><br><span class="t">Not modeled yet</span></span></div></div>';
    html += '<h2 style="font-family:var(--font-display);font-size:1.05rem;margin:0 0 8px">Runnable frontier</h2><div class="blist">';
    ITEMS.filter(function (it) { return state(it) === "unblocked"; }).forEach(function (it) {
      html += '<button class="bitem" data-item="' + it.id + '"><span><span class="mono muted">' + it.id + '</span><br><strong>' + esc(it.title) + "</strong><br><span class=\"muted\" style=\"font-size:0.8rem\">" + (it.ready ? "Prompt-ready. Needs your approval to execute." : "Not prompt-ready yet. Run a readiness pass first.") + "</span></span>" + pill("unblocked") + "</button>";
    });
    return html + "</div>" + footer();
  }
  function tile(s, n, label) { return '<div class="tile"><span class="pill s-' + s + '">' + icon(STATE[s].icon) + label + '</span><span class="n">' + n + "</span></div>"; }

  function renderMap() {
    if (route.scope !== "LCATS") return emptyProject();
    var q = query.toLowerCase();
    var html = '<div class="hero"><div><h1>Dependency map</h1><p>Lanes are workstreams; phases are organizational rows, not gates. Select a card to trace what it needs and what needs it.</p></div><button class="btn" data-view="table">' + icon("i-table") + "Accessible table</button></div>";
    html += '<div class="legend"><span class="ln"><svg class="sw" viewBox="0 0 28 8" aria-hidden="true"><path d="M1 4h26" stroke="var(--color-edge)" stroke-width="1.6"/></svg>Depends on</span><span class="ln"><svg class="sw" viewBox="0 0 28 8" aria-hidden="true"><path d="M1 4h26" stroke="var(--color-status-blocked-line)" stroke-width="1.6" stroke-dasharray="5 4"/></svg>Blocked by</span>' +
      ["done", "progress", "unblocked", "waiting", "blocked"].map(function (s) { return pill(s); }).join("") + '<span class="flag">not prompt-ready</span></div>';
    html += '<div class="mapwrap"><div class="map' + (selected ? " focus" : "") + '" id="map" style="--lanes:' + LANES.length + '"><svg class="edges" id="edges" aria-hidden="true"></svg>';
    html += '<div class="corner">Phases ↓ · Lanes →</div>';
    LANES.forEach(function (l, i) { html += '<div class="lanehead" style="grid-column:' + (i + 2) + ';grid-row:1"><div class="lk">Lane ' + String(i + 1).padStart(2, "0") + '</div><div class="ln">' + esc(l.name) + '</div><div class="muted" style="font-size:0.75rem">' + esc(l.kind) + "</div></div>"; });
    var rel = {};
    if (selected) { rel = Object.assign({}, upstream(selected), downstream(selected)); rel[selected] = 1; }
    PHASES.forEach(function (p, r) {
      html += '<div class="phasehead" style="grid-column:1;grid-row:' + (r + 2) + '"><div class="pk">Phase ' + p.id + '</div><div class="pn">' + esc(p.name) + '</div><div class="pd">' + esc(p.desc) + "</div></div>";
      LANES.forEach(function (l, c) {
        var cards = ITEMS.filter(function (it) { return it.lane === l.id && it.phase === p.id; });
        html += '<div class="cell" style="grid-column:' + (c + 2) + ";grid-row:" + (r + 2) + '">' + cards.map(function (it) {
          var s = state(it);
          var match = !q || (it.id + " " + it.title).toLowerCase().indexOf(q) >= 0;
          var cls = "tcard s-" + s + (selected === it.id ? " sel" : "") + ((selected && !rel[it.id]) || !match ? " dim" : "");
          var w = why(it);
          return '<button class="' + cls + '" data-item="' + it.id + '" id="card-' + it.id + '" aria-pressed="' + (selected === it.id) + '"><span class="mono muted">' + it.id + '</span><span class="tt">' + esc(it.title) + '</span><span class="tr">' + pill(s) + (s === "unblocked" && !it.ready ? '<span class="flag">not prompt-ready</span>' : "") + "</span>" + (w ? '<span class="why">' + esc(w) + "</span>" : "") + "</button>";
        }).join("") + "</div>";
      });
    });
    html += "</div></div>";
    return html + footer();
  }

  function drawEdges() {
    var map = document.getElementById("map");
    var svg = document.getElementById("edges");
    if (!map || !svg) return;
    var box = map.getBoundingClientRect();
    var rel = selected ? Object.assign({}, upstream(selected), downstream(selected)) : null;
    if (rel) rel[selected] = 1;
    var lanesUsed = {};
    var out = [];
    ITEMS.forEach(function (it) {
      var tgt = document.getElementById("card-" + it.id);
      if (!tgt) return;
      var tb = tgt.getBoundingClientRect();
      it.deps.map(function (d) { return [d, false]; }).concat(it.blk.map(function (b) { return [b, true]; })).forEach(function (pair) {
        var src = document.getElementById("card-" + pair[0]);
        if (!src) return;
        var sb = src.getBoundingClientRect();
        var key = pair[0];
        lanesUsed[key] = (lanesUsed[key] || 0) + 1;
        var off = (lanesUsed[key] - 1) * 6;
        var x1 = sb.left - box.left + sb.width / 2 + off - 6, y1 = sb.bottom - box.top;
        var x2 = tb.left - box.left + tb.width / 2 + off - 6, y2 = tb.top - box.top;
        var path;
        if (y2 > y1 + 8) {
          var midY = y2 - 10 - (lanesUsed[key] - 1) * 4;
          path = "M" + x1 + " " + y1 + " V" + midY + " H" + x2 + " V" + (y2 - 1);
        } else {
          var sx = sb.right - box.left, sy = sb.top - box.top + sb.height / 2, tx = tb.left - box.left, ty = tb.top - box.top + tb.height / 2;
          var mx = (sx + tx) / 2;
          path = "M" + sx + " " + sy + " H" + mx + " V" + ty + " H" + (tx - 1);
        }
        var hot = rel && rel[it.id] && rel[pair[0]];
        var mk = pair[1] ? "arrow-b" : hot ? "arrow-h" : "arrow";
        out.push('<path class="edge' + (pair[1] ? " block" : "") + (hot ? " hot" : "") + '" d="' + path + '" marker-end="url(#' + mk + ')"/>');
      });
    });
    svg.setAttribute("viewBox", "0 0 " + box.width + " " + box.height);
    svg.innerHTML = out.join("");
  }

  function renderTable() {
    if (route.scope !== "LCATS") return emptyProject();
    var q = query.toLowerCase();
    var rows = ITEMS.filter(function (it) { return !q || (it.id + " " + it.title).toLowerCase().indexOf(q) >= 0; });
    var html = '<div class="hero"><div><h1>Table</h1><p>The same snapshot as the map, as a sortable list. Every map state has a row here.</p></div><button class="btn" data-view="map">' + icon("i-map") + "Back to map</button></div>";
    html += '<div class="tablewrap"><table><caption class="muted" style="text-align:left;padding:8px 12px">LCATS work items in the sample snapshot</caption><thead><tr><th scope="col">ID</th><th scope="col">Title</th><th scope="col">Lane</th><th scope="col">Phase</th><th scope="col">Lifecycle</th><th scope="col">Structural state</th><th scope="col">Prompt-ready</th><th scope="col">Needs</th></tr></thead><tbody>';
    rows.forEach(function (it) {
      var lane = LANES.filter(function (l) { return l.id === it.lane; })[0];
      html += '<tr class="rowlink" data-item="' + it.id + '" tabindex="0"><td class="mono">' + it.id + "</td><td>" + esc(it.title) + "</td><td>" + esc(lane.name) + "</td><td>" + it.phase + " · " + esc(PHASES[it.phase].name) + "</td><td>" + it.life + "</td><td>" + pill(state(it)) + "</td><td>" + (it.life === "resolved" ? "—" : it.ready ? "yes" : "no") + '</td><td class="mono">' + (it.deps.concat(it.blk).join(", ") || "—") + "</td></tr>";
    });
    return html + "</tbody></table></div>" + footer();
  }

  function renderBlockers() {
    if (route.scope !== "LCATS") return emptyProject();
    var list = ITEMS.filter(function (it) { var s = state(it); return s === "blocked" || s === "waiting"; });
    var html = '<div class="hero"><div><h1>Blockers</h1><p>Every waiting or blocked task, with the exact records it needs. Filters never hide a blocker.</p></div></div><div class="blist">';
    list.forEach(function (it) {
      html += '<button class="bitem" data-item="' + it.id + '"><span><span class="mono muted">' + it.id + "</span><br><strong>" + esc(it.title) + '</strong><br><span class="muted" style="font-size:0.8rem">' + esc(why(it)) + "</span></span>" + pill(state(it)) + "</button>";
    });
    return html + "</div>" + footer();
  }

  function renderEvidence() {
    return '<div class="hero"><div><h1>Evidence</h1><p>Validation runs, execution records, and evidence notes for this project.</p></div></div><div class="empty"><h2>Evidence views come after the map</h2><p class="muted">This slot holds the evidence chain: validation output, execution records, and review notes, each linked to its source file. It is shown here so the frame and navigation can be judged with every planned view present.</p></div>' + footer();
  }

  function emptyProject() {
    return '<div class="hero"><div><h1>' + esc(route.scope) + '</h1><p>No dependency-map view is declared for this project yet.</p></div></div><div class="empty"><h2>Declare a view to see the map</h2><p class="muted">Add a view declaration with ordered lanes and phases, then refresh. Until then this project appears on the statusboard only. Try LCATS in the sidebar for the sample map.</p></div>' + footer();
  }

  function footer() { return '<p class="footer">Mock of the LRH Console shared web UI with illustrative sample data, not live project state. In the product, the static version renders this markup on the server and works without JavaScript; selection, tracing, and the drawer are an interactive layer on top.</p>'; }

  function renderDrawer() {
    var d = document.getElementById("drawer");
    if (!selected || route.scope === "all") { d.hidden = true; d.innerHTML = ""; return; }
    var it = byId[selected];
    var s = state(it);
    var lane = LANES.filter(function (l) { return l.id === it.lane; })[0];
    var pre = it.deps.map(function (x) { return [x, "depends on"]; }).concat(it.blk.map(function (x) { return [x, "blocked by"]; }));
    var deps = dependents(it.id);
    var auth = it.life === "resolved" ? "Not needed" : "Needs your approval";
    d.hidden = false;
    d.innerHTML =
      '<div class="dhead"><div style="flex:1;min-width:0"><span class="mono muted">' + it.id + '</span><h2 id="dtitle">' + esc(it.title) + '</h2></div><button class="iconbtn" id="dclose" aria-label="Close details">' + icon("i-x") + "</button></div>" +
      '<section><h3>State, three layers</h3><dl class="layers"><dt>Lifecycle</dt><dd><span class="mono">' + it.life + "</span> <span class=\"muted\">from the work item</span></dd><dt>Structural</dt><dd>" + pill(s) + " <span class=\"muted\">computed</span></dd><dt>Prompt-ready</dt><dd>" + (it.life === "resolved" ? "—" : it.ready ? "Yes" : "No, run a readiness pass") + "</dd><dt>Authorized</dt><dd>" + auth + "</dd></dl></section>" +
      '<section><h3>Placement</h3><dl class="layers"><dt>Lane</dt><dd>' + esc(lane.name) + "</dd><dt>Phase</dt><dd>" + it.phase + " · " + esc(PHASES[it.phase].name) + "</dd></dl></section>" +
      (why(it) ? '<section><h3>Why ' + (s === "blocked" ? "blocked" : "waiting") + "?</h3><p style=\"margin:0\">" + esc(why(it)) + ".</p></section>" : "") +
      '<section><h3>Needs (' + pre.length + ')</h3>' + (pre.length ? '<ul class="plist">' + pre.map(function (p) { return '<li><button data-item="' + p[0] + '"><span><span class="mono">' + p[0] + '</span> <span class="muted">' + p[1] + "</span></span>" + pill(state(byId[p[0]])) + "</button></li>"; }).join("") + "</ul>" : '<p class="muted" style="margin:0">Nothing upstream.</p>') + "</section>" +
      '<section><h3>Needed by (' + deps.length + ')</h3>' + (deps.length ? '<ul class="plist">' + deps.map(function (x) { return '<li><button data-item="' + x.id + '"><span class="mono">' + x.id + "</span>" + pill(state(x)) + "</button></li>"; }).join("") + "</ul>" : '<p class="muted" style="margin:0">Nothing downstream.</p>') + "</section>" +
      '<section><h3>Source</h3><div class="src"><span class="mono">project/work_items/' + (it.life === "resolved" ? "resolved" : "proposed") + "/" + it.id + '.md</span><button class="iconbtn" id="dcopy" aria-label="Copy source path">' + icon("i-copy") + "</button></div><p class=\"muted\" style=\"font-size:0.78rem;margin:6px 0 0\">Snapshot 6 Oct 2026, 21:40 · sample</p></section>" +
      '<section><h3>Effort</h3><p class="muted" style="margin:0">Not modeled yet.</p></section>' +
      '<div class="actions"><button class="btn primary" data-view="table">' + icon("i-table") + 'Show in table</button><button class="btn" id="dfocus">' + icon("i-focus") + "Focus on map</button></div>";
  }

  var PAGES = { statusboard: "Statusboard", overview: "Overview", map: "Dependency map", table: "Table", blockers: "Blockers", evidence: "Evidence" };
  function render() {
    renderNav();
    document.getElementById("pageName").textContent = PAGES[route.view];
    document.getElementById("pageScope").textContent = route.scope === "all" ? "All projects" : route.scope;
    var fn = { statusboard: renderStatusboard, overview: renderOverview, map: renderMap, table: renderTable, blockers: renderBlockers, evidence: renderEvidence }[route.view];
    document.getElementById("main").innerHTML = fn();
    renderDrawer();
    if (route.view === "map") requestAnimationFrame(drawEdges);
    setHash();
  }

  function go(scope, view) { route = { scope: scope, view: view }; if (scope === "all") selected = null; render(); document.getElementById("main").scrollTop = 0; }

  document.getElementById("home").addEventListener("click", function () { selected = null; go("all", "statusboard"); document.getElementById("main").focus(); });
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-scope],[data-view],[data-item],[data-project],#dclose,#dfocus,#dcopy,#gear,#refresh,#collapse,[data-theme-choice]");
    if (!t) { if (!e.target.closest(".popwrap")) closePop(); return; }
    if (t.dataset.scope) { go(t.dataset.scope, t.dataset.scope === "all" ? "statusboard" : (route.scope === t.dataset.scope ? route.view : "overview")); return; }
    if (t.dataset.view) { go(route.scope, t.dataset.view); return; }
    if (t.dataset.project) { var p = t.dataset.project; go(p, p === "LCATS" ? "map" : "overview"); return; }
    if (t.dataset.item) { selected = selected === t.dataset.item && t.classList.contains("tcard") ? null : t.dataset.item; render(); var c = document.getElementById("card-" + selected); if (c && route.view === "map") c.focus({ preventScroll: false }); return; }
    if (t.id === "dclose") { selected = null; render(); return; }
    if (t.id === "dfocus") { if (route.view !== "map") { route.view = "map"; } render(); var cc = document.getElementById("card-" + selected); if (cc) cc.scrollIntoView({ block: "center", inline: "center" }); return; }
    if (t.id === "dcopy") { var path = t.parentNode.querySelector(".mono").textContent; try { navigator.clipboard.writeText(path).catch(function () {}); } catch (err) {} return; }
    if (t.id === "gear") { var pop = document.getElementById("pop"); pop.hidden = !pop.hidden; t.setAttribute("aria-expanded", String(!pop.hidden)); return; }
    if (t.dataset.themeChoice) { setTheme(t.dataset.themeChoice); return; }
    if (t.id === "refresh") { var ft = document.querySelector(".fresh .ft"); if (ft) ft.textContent = "Snapshot refreshed just now"; return; }
    if (t.id === "collapse") { var app = document.getElementById("app"); var rail = app.classList.toggle("rail"); t.setAttribute("aria-expanded", String(!rail)); t.setAttribute("aria-label", rail ? "Expand sidebar" : "Collapse sidebar"); try { localStorage.setItem("lrh-mock-rail", rail ? "1" : "0"); } catch (err) {} if (route.view === "map") requestAnimationFrame(drawEdges); return; }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if (!document.getElementById("pop").hidden) { closePop(); return; } if (selected) { selected = null; render(); } }
    if (e.key === "Enter" && e.target.matches("tr.rowlink")) { selected = e.target.dataset.item; render(); }
  });
  function closePop() { var pop = document.getElementById("pop"); if (!pop.hidden) { pop.hidden = true; document.getElementById("gear").setAttribute("aria-expanded", "false"); } }
  document.getElementById("q").addEventListener("input", function (e) { query = e.target.value.trim(); var pos = e.target.selectionStart; render(); var q = document.getElementById("q"); q.focus(); try { q.setSelectionRange(pos, pos); } catch (err) {} });

  function setTheme(choice) {
    var root = document.documentElement;
    if (choice === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", choice);
    ["light", "dark", "system"].forEach(function (c) { document.getElementById("th-" + c).setAttribute("aria-pressed", String(c === choice)); });
    try { localStorage.setItem("lrh-mock-theme", choice); } catch (err) {}
  }
  try { var saved = localStorage.getItem("lrh-mock-theme"); if (saved) setTheme(saved); } catch (err) {}
  try { if (localStorage.getItem("lrh-mock-rail") === "1") document.getElementById("app").classList.add("rail"); } catch (err) {}

  window.addEventListener("hashchange", function () { readHash(); render(); });
  window.addEventListener("resize", function () { if (route.view === "map") drawEdges(); });
  if (window.ResizeObserver) new ResizeObserver(function () { if (route.view === "map") drawEdges(); }).observe(document.getElementById("main"));
  readHash();
  render();
})();
</script>

</body>
</html>
